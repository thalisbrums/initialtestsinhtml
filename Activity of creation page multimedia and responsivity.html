<!DOCTYPE html>
<html lang="pt">
<head> 
    <title>Page HTML Responsive with Multimedia</title>
   <meta charset="UTF-8"> 
   <meta name="Thalis Brum" content="First HTML Page">
   <meta name="viewport" content="width=device-width", initial-scale="1.0">
</head>
<body>
    <h1>Atividade de criação de página com Multimídia e Responsividade</h1>
    <!--Imagens com atributos src, alt, width e height-->
        <p><img src="https://cdn.pixabay.com/photo/2022/03/21/21/44/file-7084006_1280.png" alt="Imagem de ícone de documento HTML" width="300" height="300"></p>
        <p><img src="https://cdn.pixabay.com/photo/2021/03/27/06/31/code-6127616_1280.png" alt="Ilustração minimalista de janela de código para programação e desenvolvimento web" width="150" height="150">
        <img src="https://cdn.pixabay.com/photo/2022/07/08/05/38/freelance-work-7308505_1280.png" alt="Ilustração profissional FullStack" width="300" height="150"></p>

    <!--Imagens com responsividade com atributos srcset e sizes-->
        
    <p>
        <img
            src="images/reguas-pequeno-640x480.jpg" 
            srcset="images/reguas-pequeno-640x480.jpg 640w"
            sizes="(max-width: 700px) 100vw, 640px"
            alt="Imagens de Réguas"
            width="640", height="480">
    </p>
    


</body>
</html>
