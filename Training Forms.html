<!DOCTYPE html>
<html lang="en">
<head> 
    <title>Page HTML first attempt</title>
   <meta charset="UTF-8"> 
   <meta name="Thalis Brum" content="First HTML Page">
   <meta name="viewport" content="width=device-width", initial-scale="1.0">
</head>
<form action="/submit" method="post">
	  <p><label for="nome">Nome:</label>
	  <input type="text" id="nome" name="nome" placeholder="Digite o seu nome" required></p>
	  
      <p><label for="email">Email:</label>
	  <input type="email" id="email" name="email" placeholder="Digite o seu email" required></p>
	  
      <p><label for="senha">Senha:</label>
	  <input type="password" id="senha" name="senha" pattern=".{8,}" title="A senha deve ter pelo menos 8 caracteres." placeholder="Digite a sua senha" required></p>
	  <button type="submit">Enviar</button>
</form>
